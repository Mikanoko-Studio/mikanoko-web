<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=DM+Mono:wght@400&display=block" rel="stylesheet">
<style>
  /* Rendered at 2x (660x180) and shown at 330x90. The orange rule is baked in
     rather than built as a table row: it is decorative, so nothing is lost if
     a client blocks images, and it can never drift out of line with the card. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:660px; height:180px; background:transparent; }
  .card {
    width:660px; height:150px;
    background:#FBF4E4;
    border:5px solid #2B2420;
    border-radius:18px;
    display:flex; align-items:center; gap:26px;
    padding:0 34px;
  }
  .name { font-family:'Zen Maru Gothic',sans-serif; font-weight:900; font-size:44px; color:#2B2420; line-height:1; letter-spacing:-0.01em; }
  .kana { font-family:'DM Mono',monospace; font-size:17px; color:#7A6C61; letter-spacing:.18em; margin-top:11px; }
  .rule { width:104px; height:6px; background:#F0722B; margin-top:24px; }
</style></head>
<body>
  <div class="card">
    <svg width="88" height="88" viewBox="0 0 64 64">
      <circle cx="32" cy="38" r="21" fill="#F0722B" stroke="#2B2420" stroke-width="3"/>
      <path d="M22 31 q4 -6 10 -6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/>
      <path d="M32 17 v-5" stroke="#2B2420" stroke-width="3" stroke-linecap="round"/>
      <path d="M33 12 q9 -7 15 -2 q-5 8 -15 2 Z" fill="#3F7D52" stroke="#2B2420" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="name">Mikanoko Studio</div>
      <div class="kana">ミカノコスタジオ</div>
    </div>
  </div>
  <div class="rule"></div>
</body></html>
