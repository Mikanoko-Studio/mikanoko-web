<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Mikanoko Studio email signature</title></head>
  <body style="margin:24px;background:#ffffff">
    <!--
      Open this file in a browser, select all (Cmd+A), copy (Cmd+C), then paste
      into Gmail: Settings -> See all settings -> General -> Signature.

      Everything below is inline-styled and table-based on purpose. Gmail strips
      <style> blocks, classes, web fonts and SVG, so none of those are used.
    -->
    <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
      <tr>
        <td style="padding:0 0 12px 0">
          <img
            src="https://mikanoko.studio/studio/signature/mikanoko-signature.png"
            alt="Mikanoko Studio"
            width="330"
            height="75"
            style="display:block;border:0;outline:none;text-decoration:none;width:330px;height:75px"
          />
        </td>
      </tr>
      <tr>
        <td style="padding:0 0 10px 0">
          <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse">
            <tr><td height="3" width="52" bgcolor="#F0722B" style="line-height:3px;font-size:0">&nbsp;</td></tr>
          </table>
        </td>
      </tr>
      <tr>
        <td style="font-size:14px;line-height:22px;color:#2B2420">
          <a href="mailto:hello@mikanoko.studio" style="color:#2B2420;text-decoration:none">hello@mikanoko.studio</a>
          <span style="color:#C9BCA8">&nbsp;·&nbsp;</span>
          <a href="https://mikanoko.studio" style="color:#F0722B;text-decoration:none">mikanoko.studio</a>
        </td>
      </tr>
      <tr>
        <td style="padding:6px 0 0 0;font-size:12px;line-height:18px;color:#7A6C61">
          we make small software. some of it is useful.
        </td>
      </tr>
    </table>
  </body>
</html>
